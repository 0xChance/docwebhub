<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>docWebHub CAD</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0f1113;
    color: #aab2bd;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
  }

  /* The viewer builds its canvas and chrome inside this element and sizes it
     from the box, so it has to be a real, laid-out rectangle. */
  #host { position: absolute; inset: 0; }

  #status {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    background: #0f1113;
  }

  #status[hidden] { display: none; }

  /* Floating over the canvas, opposite the viewer's own toolbar in the
     top-right corner. Same dark pill so it reads as part of the viewer. */
  #export {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 3;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 11px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 6px;
    background: rgba(23, 26, 30, 0.88);
    color: #cfd6df;
    font: inherit;
    cursor: pointer;
  }

  #export:hover:not([disabled]) {
    background: rgba(38, 43, 50, 0.92);
    color: #fff;
  }

  #export[disabled] {
    opacity: 0.55;
    cursor: default;
  }

  #export[hidden] { display: none; }

  #toast {
    position: absolute;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%);
    z-index: 4;
    max-width: 80%;
    padding: 8px 14px;
    border-radius: 6px;
    background: rgba(60, 24, 24, 0.94);
    border: 1px solid rgba(255, 120, 120, 0.35);
    color: #ffd9d9;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #toast[hidden] { display: none; }
</style>
</head>
<body>
<div id="host"></div>
<div id="status" data-loading="{{.Loading}}" data-failed="{{.Failed}}">{{.Loading}}</div>
<button id="export" type="button" hidden data-failed="{{.ExportFailed}}">
  <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor"
       stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M10 3v9m0 0 3.5-3.5M10 12 6.5 8.5M4 16.5h12" />
  </svg>{{.ExportPdf}}
</button>
<div id="toast" hidden></div>

<script type="module">
  import {
    AcApDocManager,
    AcDbDatabaseConverterManager,
    AcDbFileType,
    AcDbLibreDwgConverter,
  } from './viewer.js';

  const host = document.getElementById('host');
  const status = document.getElementById('status');
  const text = { loading: status.dataset.loading, failed: status.dataset.failed };

  let docManager = null;
  let started = false;

  // The viewer reads DXF with its own parser and registers no DWG converter, so
  // the host has to. Registering is cheap: nothing is fetched until a .dwg is
  // opened, at which point the worker pulls its 10 MB wasm from the same folder.
  try {
    AcDbDatabaseConverterManager.instance.register(
      AcDbFileType.DWG,
      new AcDbLibreDwgConverter({
        parserWorkerUrl: new URL('./assets/libredwg-parser-worker.js', location.href).href,
      })
    );
  } catch (err) {
    // A missing converter must not take DXF preview down with it; the DWG open
    // then fails and reports the same message as any other unreadable drawing.
  }

  function showState(message) {
    status.textContent = message;
    status.hidden = false;
  }

  function notify(message) {
    if (window.parent !== window) {
      window.parent.postMessage(message, '*');
    }
  }

  function fail() {
    started = false;
    showState(text.failed);
    notify({ lwCad: 'error', code: 'failed' });
  }

  function fitToView() {
    try {
      const view = docManager && docManager.curView;
      if (view && typeof view.zoomToFitDrawing === 'function') {
        view.zoomToFitDrawing();
      }
    } catch (err) {
      // A refused fit only leaves the initial framing; never fail the preview.
    }
  }

  const exportBtn = document.getElementById('export');
  const toast = document.getElementById('toast');
  let toastTimer = 0;

  function showToast(message) {
    toast.textContent = message;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.hidden = true; }, 5000);
  }

  // Vector export through the upstream PDF plugin. The plugin bundle is a
  // separate file fetched on first use, so an export nobody runs costs nothing
  // beyond the click. The convertor shows the viewer's own busy overlay and
  // names the download after the drawing.
  exportBtn.addEventListener('click', async () => {
    if (!docManager || exportBtn.disabled) {
      return;
    }
    exportBtn.disabled = true;
    try {
      const { AcApPdfConvertor, resolveAcApPdfExportOptions } = await import('./pdf.js');
      await new AcApPdfConvertor().convert(docManager.context, resolveAcApPdfExportOptions({
        modelSpaceFit: 'extents',
        exportLayouts: true,
        // Glyphs are painted as geometry. The 'text' mode embeds font subsets
        // through pdf-lib, whose fontkit chokes on deeply subset fonts — Latin
        // and CJK glyphs vanish depending on which file supplied them. Vector
        // output is what the screen shows, every time, in every viewer.
        textMode: 'vector',
      }));
    } catch (err) {
      showToast(exportBtn.dataset.failed);
    } finally {
      exportBtn.disabled = false;
    }
  });

  try {
    docManager = AcApDocManager.createInstance({
      container: host,
    // Fonts are looked up under <baseUrl>/fonts/. The catalog there maps the
    // font names drawings use onto two open fonts, because the SHX set and the
    // Windows fonts those names belong to cannot be redistributed; text is
    // therefore legible but not a stroke-for-stroke copy of the original. Pass
    // -cad-fonts-dir to serve the real fonts instead.
      baseUrl: new URL('./data/', location.href).href,
      autoResize: true,
    });
  } catch (err) {
    docManager = null;
  }

  if (!docManager) {
    fail();
  }

  window.addEventListener('message', async (event) => {
    const data = event.data || {};

    // The host tells us the frame is actually visible now; that is the first
    // moment the drawing can be fitted to a box with a real size.
    if (data.lwCad === 'shown') {
      fitToView();
      return;
    }

    if (data.lwCad !== 'open' || !docManager) {
      return;
    }
    if (started) {
      // One document per page; the listing tears the frame down to switch.
      return;
    }
    started = true;

    try {
      const ok = await docManager.openDocument(data.name || 'drawing.dxf', data.buffer, {
        // AcEdOpenMode.Read: the preview never writes back to the file.
        mode: 0,
      });
      if (!ok) {
        fail();
        return;
      }
      status.hidden = true;
      exportBtn.hidden = false;
      notify({ lwCad: 'ready' });

      // The open fits the drawing to the canvas it measures at that moment, but
      // this page is usually inserted into a pane that is still settling, so the
      // first fit is computed against the wrong size. Fit again once the frame
      // has been laid out; a second pass covers a pane that keeps growing.
      requestAnimationFrame(() => {
        fitToView();
        setTimeout(fitToView, 250);
      });
    } catch (err) {
      fail();
    }
  });

  // The listing holds the file bytes (it already fetched them with the site
  // password), so the page asks for them instead of fetching the URL itself.
  notify({ lwCad: 'hello' });
</script>
</body>
</html>
